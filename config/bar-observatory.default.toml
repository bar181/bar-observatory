version = 1
enabled = true

# Note: the resolver's own behavior (project_config_path, env var allowlist, unknown-key policy)
# is fixed in code (bar-obs-config::ResolverConfig), not read from this file — there is no
# [config] table in what `bar init` actually writes or what `bar_observatory::Config` accepts.
# An earlier draft of this example documented a [config]/[config.env_allowlist] table here that
# the binary would reject as an unknown top-level key; removed so this file matches reality.

[product]
name = "BAR Observatory"
expansion = "Base Agentic Reporter"
command = "bar"

[storage]
directory = ".bar"
ambient_database = "ambient.sqlite"
index_database = "index.sqlite"
retain_days = 90

[measurements.session]
enabled = true

[measurements.prompts]
enabled = true
store_text = true

[measurements.tasks]
enabled = true
capture_explicit_tasks = true
infer_when_missing = true

[measurements.agents]
enabled = true
capture_hierarchy = true
capture_messages = true

[measurements.skills]
enabled = true
capture_available = true
capture_loaded = true
capture_invoked = true
hash_content = true

[measurements.tools]
enabled = true

[measurements.terminal]
enabled = true
capture_output = "sanitized"
max_output_bytes = 262144

[measurements.files]
enabled = true
capture_versions = true
capture_content = "diff"

[measurements.git]
enabled = true

# cost_mode changed 2026-07-31 (Bradley's ruling): "authoritative_only" left cost permanently
# unrenderable on any non-proxy capture path (confirmed live: the `requests` table is 0 rows on
# ambient/hook/OTLP-only sessions) with no schema field to carry it even if fixed. Two-tier rule
# now: prefer real provider-billed/proxy-captured cost when available; fall back to a
# published-price-table estimate (tokens x per-model rate) when it isn't, always labeled which
# source was used (schemas/report.schema.json's provider_usage.cost_source) — never silently
# blank, never silently presented as authoritative when it's an estimate.
[measurements.provider_usage]
enabled = true
cost_mode = "authoritative_preferred_priced_fallback"

[measurements.validation]
enabled = true
parsers = ["cargo", "pytest", "npm", "generic-exit"]

[measurements.process]
enabled = true
workflow = "standard-eight-phase-v1"

[measurements.rework]
enabled = true
validation_redo = true
human_correction = true
agent_retry = true
task_reopened = true
plan_rejected = true
file_rework = true
rollback = true
superseded_output = true
abandoned_work = true
conflicting_handoff = true
routing_change_after_failure = true
skill_change_after_failure = true

[measurements.human_ai_recovery]
enabled = true

[measurements.micro_observations]
enabled = true
extract_agent_signals = true
detect_unreported_evidence_gaps = true
promote_threshold = 2
featured_limit = 12

[reports.engineering]
enabled = true
default_format = "html"
additional_formats = ["md"]
# Standardized on report.template_version's semantic-version form (this field selects the same
# template that field records the version of -- they must match, one canonical form).
template = "bar-observatory-engineering-1.0"

[reports.self_improvement]
enabled = false
# Same semantic-version convention as [reports.engineering].template above, applied here too even
# though no example currently exercises self-improvement's template_version — a real reviewer
# caught the CONFIRM note above stating "one canonical form" while this line still said -v1, five
# lines below itself.
template = "bar-observatory-self-improvement-1.0"
provider = "claude-code-session"
model = "runtime-recorded"
require_fact_refs = true

[report_sections]
tasks = true
process = true
rework = true
agents = true
skills = true
human_ai_recovery = true
repository = true
validation = true
micro_observations = true
silent_signals = true
capture_quality = true

# ADR-127: replaces the old, decorative [privacy] table. Secrets are always
# scrubbed at the write seam (ADR-125 rule 1) regardless of this table —
# `secrets` here is a locked, non-disableable acknowledgement, not a switch.
[redact]
mode    = "off"                 # off | export | strict — off = fully verbatim (local analysis)
paths   = "verbatim"            # verbatim | home-relative | mask-foreign
                                 # (home-relative is a display convenience, not a security control)
secrets = "detect_and_report"   # the only accepted value — not user-disableable

[integrity]
manifest = true
hash_algorithm = "blake3"
sign = false
provenance = true

# Branding is defined ONCE in branding.default.toml (single source of truth, ADR-020).
# This table is a POINTER only — it selects the branding profile; identity fields are NOT
# duplicated here (removed 2026-08-02 to kill the drift the Phase-3 plan flagged). An earlier
# draft of this example still had the pre-refactor identity fields inline, which the binary
# would reject as unknown fields; removed so this file matches reality.
[branding]
profile = "bradley-academy"
